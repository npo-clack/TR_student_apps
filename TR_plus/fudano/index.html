<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoリスト</title>
  <link rel="stylesheet" href="styles.css">
</head>
<script src="script.js"></script>
<script src="chat.js"></script>
<body>
  <h1>ToDo List</h1>
  
  <button class = "chatButton" id = "chat-toggle" type="button" onclick="toggleChat()"><<<</button>
  
  <div id="chat">
    <div id="chat-messages"></div>
    <input type="text" id="chat-input" placeholder="チャットを入力">
    <button type="button" class="MessageButton" id="send-message-btn" onclick="sendMessage()">送信</button>
  </div>
  

  <div id="taskStats" class="chat">
    <p>タスク完了数: <span id="completed">0</span>/<span id="total">0</span></p>
    <p>達成度: <span id="percentatage">0</span>%</p>
  </div>

  <div class="input-area">
    <input type="text" id="task-input" class="task-input-css" placeholder="新しいタスクを入力">
    <button type="button" id="add-task-btn" class="btn-add" onclick="addTask()">追加</button>
    <button onclick="clearTasks()">全て削除</button>
    <button onclick="saveTasks()">保存</button>
    <button onclick="loadTasks()">読み込み</button>
  </div>
</body>
</html>
